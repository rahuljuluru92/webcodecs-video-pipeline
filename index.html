<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebCodecs Video Pipeline</title>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>WebCodecs Video Pipeline</h1>
        <p class="subtitle">Stage 4 — worker-based decode/render off the main thread</p>
      </header>

      <div class="controls">
        <input id="file-input" type="file" accept="video/mp4" />
        <button id="play-button" disabled>Play</button>
        <button id="reverse-button" disabled>Reverse: Off</button>
        <select id="speed-select" disabled>
          <option value="0.5">0.5x</option>
          <option value="1" selected>1x</option>
          <option value="1.5">1.5x</option>
          <option value="2">2x</option>
        </select>
      </div>

      <canvas id="video-canvas" width="640" height="360"></canvas>

      <div class="scrub-row">
        <input id="scrubber" type="range" min="0" max="1" step="0.001" value="0" disabled />
        <span id="time-display">0.00 / 0.00s</span>
      </div>

      <p id="status" class="status">Choose an MP4 file to begin.</p>
      <p id="metrics" class="status"></p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
